name: checks

# The commit-message rules in docs/engineering-standards.zh-CN.md were enforced
# by hand: the standards landed on 2026-10-14 and 21 commits before that date
# still fail `npm run check:commits`. This job makes the same command block a
# pull request, so the rules are verified rather than remembered.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          # check:commits needs the base commit, not just the merged tree.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Check commit messages and per-commit typecheck
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # Every commit must typecheck on its own, so --typecheck checks out each
        # one in a temporary worktree under .tmp/.
        run: npm run check:commits -- "$BASE..$HEAD" --typecheck

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npm ci
      - run: npm run cargo -- fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: npm run test:rust
