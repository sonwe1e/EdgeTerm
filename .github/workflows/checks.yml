name: checks

# The commit-message rules in docs/engineering-standards.zh-CN.md were enforced
# by hand: the standards landed on 2026-10-14 and 21 commits before that date
# still fail `npm run check:commits`. This job makes the same command block a
# pull request, so the rules are verified rather than remembered.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          # check:commits needs the base commit, not just the merged tree.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # npm ci reports advisory counts without affected paths. Preserve the
      # detail for review; this is an inventory, not a replacement for tests
      # or an automatic/force dependency upgrade.
      - name: Record dependency advisories (informational)
        continue-on-error: true
        run: npm audit --json
      - run: npm run typecheck
      - run: npm run version:check
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Check commit messages and per-commit typecheck
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # Every commit must typecheck on its own, so --typecheck checks out each
        # one in a temporary worktree under .tmp/.
        run: npm run check:commits -- "$BASE..$HEAD" --typecheck

  browser:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Use the hosted runner's Chrome through the repository's supported
      # channel override; do not substitute jsdom for actual layout/input.
      - run: google-chrome --version
      - run: npm run test:browser
        env:
          PERF_BROWSER: chrome
      - name: Capture real App font and layout evidence
        if: success() || failure()
        run: node scripts/run-task.mjs script scripts/check-app-font-chain.mjs ci
        env:
          PERF_BROWSER: chrome
      - name: Capture readonly viewer and interaction evidence
        if: success() || failure()
        run: node scripts/run-task.mjs script scripts/check-refinement-shots.mjs ci-ui-audit
        env:
          PERF_BROWSER: chrome
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-evidence
          path: |
            .tmp/records/implementation-03/
            .tmp/records/refinement-shots/ci-ui-audit/
            src/**/__screenshots__/
          include-hidden-files: true
          if-no-files-found: warn

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          # serialport's Linux device discovery needs libudev headers/pkg-config.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npm ci
      - run: npm run cargo -- fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: npm run test:rust
      # Verify changes to the typed IPC contract against the Rust exporter,
      # including return types used by remote editable-file preparation.
      - run: npm run check:bindings
